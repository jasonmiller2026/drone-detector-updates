<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detector Comparison</title>
<style>
  :root { --bg: #0b0f14; --panel: #141a21; --text: #e8edf3; --muted: #8b97a9; --line: rgba(255, 255, 255, .1); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 600 13px Inter, system-ui, sans-serif; }
  main { display: flex; height: 100%; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .col + .col { border-left: 8px solid #000; }   /* a solid black bar between the two phones (Jason: "it just looks like one big map") */
  .col h2 { margin: 0; padding: 9px 12px; font-size: 14px; background: var(--panel); border-bottom: 2px solid #000; }
  .col:first-child h2 { box-shadow: inset 0 -3px 0 #22d3ee; }
  .col + .col h2 { box-shadow: inset 0 -3px 0 #f97316; }
  .col h2 span { color: var(--muted); font-weight: 500; margin-left: 6px; }
  iframe { flex: 1; width: 100%; border: 0; }
</style></head>
<body><main>
  <div class="col"><h2>Our detector<span>single radio board</span></h2><iframe src="index.html?live=board" title="Our detector"></iframe></div>
  <div class="col"><h2>Dronetag RIDER<span>over USB</span></h2><iframe src="index.html?live=rider" title="Dronetag RIDER"></iframe></div>
</main></body></html>
